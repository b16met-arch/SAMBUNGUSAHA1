<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Bahan — SAMBUNGUSAHA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="tambah-bahan"><div id="nav"></div><main class="container py-4">
<h2 class="fw-bold">Tawarkan Bahan Sisa</h2><p class="text-muted">Data tersimpan di LocalStorage browser (prototype).</p>
<div class="su-card p-4"><div id="err" class="alert alert-danger d-none"></div>
<form id="form" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label">Nama bahan</label><input id="nama" class="form-control" placeholder="mis. Ampas kopi"></div>
<div class="col-md-6"><label class="form-label">Kategori</label><select id="kategori" class="form-select"></select></div>
<div class="col-12"><label class="form-label">Deskripsi</label><textarea id="deskripsi" rows="3" class="form-control"></textarea></div>
<div class="col-md-3"><label class="form-label">Jumlah</label><input id="jumlah" type="number" min="1" class="form-control"></div>
<div class="col-md-3"><label class="form-label">Satuan</label><select id="satuan" class="form-select"><option>kg</option><option>pcs</option><option>lembar</option><option>liter</option></select></div>
<div class="col-md-3"><label class="form-label">Harga (Rp, 0 = gratis)</label><input id="harga" type="number" min="0" class="form-control"></div>
<div class="col-md-3"><label class="form-label">Lokasi</label><input id="lokasi" class="form-control" placeholder="Kota"></div>
<div class="col-12"><label class="form-label">Foto (opsional, maks 300 KB)</label><input id="foto" type="file" accept="image/*" class="form-control"></div>
<div class="col-12"><button class="btn btn-su px-4">Publikasikan</button></div></div></form></div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script><script src="js/main.js"></script><script src="js/app.js"></script></body></html>
